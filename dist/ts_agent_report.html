<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>时间序列 LLM Agent 专题报告</title>
  <style>
    :root {
      --stage-w: 1920px;
      --stage-h: 1080px;
      --font-sans: 'Inter', 'Noto Sans CJK SC', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
      --bg-viewport: #E2E8F0;
      --ink: #0F172A;
      --ink-2: #334155;
      --ink-3: #64748B;
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-soft: #EFF6FF;
      --red: #BE123C;
      --line: #CBD5E1;
      --line-soft: #E2E8F0;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-viewport);
      font-family: var(--font-sans);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    .viewport-scaler {
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .presentation-stage {
      width: var(--stage-w);
      height: var(--stage-h);
      background: #FFFFFF;
      border-radius: 8px;
      box-shadow: 0 24px 64px rgba(15, 23, 42, 0.16);
      position: relative;
      overflow: hidden;
      transform-origin: center center;
      flex-shrink: 0;
    }

    .slide {
      position: absolute;
      inset: 0;
      padding: 28px 56px 24px 56px;
      display: none;
      flex-direction: column;
      background: #FFFFFF;
    }

    .slide.active {
      display: flex;
      animation: fadeIn 0.18s ease-out;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .slide::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, #1D4ED8 0%, #3B82F6 55%, #E2E8F0 100%);
    }

    /* Frameless Swiss Editorial Header — zero heavy box chrome */
    .slide-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid #E2E8F0;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: baseline;
      gap: 16px;
      min-width: 0;
    }

    .slide-num {
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: 800;
      color: #2563EB;
      letter-spacing: 0.04em;
      flex-shrink: 0;
    }

    .slide-title {
      font-size: 34px;
      font-weight: 800;
      color: #0F172A;
      letter-spacing: -0.02em;
      white-space: nowrap;
    }

    .slide-agenda-rail {
      display: flex;
      align-items: center;
      gap: 2px;
      flex-shrink: 0;
    }

    .agenda-pill {
      appearance: none;
      border: none;
      background: transparent;
      color: #94A3B8;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 700;
      padding: 4px 7px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.14s ease;
      white-space: nowrap;
    }

    .agenda-pill:hover { color: #1D4ED8; background: #F1F5F9; }
    .agenda-pill.active {
      color: #1D4ED8;
      background: #EFF6FF;
      box-shadow: inset 0 -2px 0 #2563EB;
    }

    /* Open-Canvas Visual Stage */
    .visual-stage {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 14px 0 4px 0;
    }

    .visual-stage svg { font-family: "Noto Sans CJK SC", "Inter", sans-serif;
      width: 100%;
      height: 100%;
      display: block;
    }

    

    /* Presenter HUD */
    .presenter-hud {
      position: fixed;
      right: 18px;
      bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(15, 23, 42, 0.84);
      backdrop-filter: blur(8px);
      padding: 5px 10px;
      border-radius: 999px;
      z-index: 100;
    }

    .hud-btn {
      appearance: none;
      border: none;
      background: transparent;
      color: #E2E8F0;
      font-family: var(--font-sans);
      font-size: 12.5px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 999px;
      cursor: pointer;
    }

    .hud-btn:hover { background: rgba(255, 255, 255, 0.14); color: #FFFFFF; }
    .hud-counter { color: #94A3B8; font-family: var(--font-mono); font-size: 12px; font-weight: 700; padding: 0 4px; }

    /* TOC Drawer */
    .drawer-backdrop {
      position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.28);
      opacity: 0; pointer-events: none;
      transition: opacity 0.18s ease; z-index: 150;
    }
    .drawer-backdrop.open { opacity: 1; pointer-events: auto; }

    .toc-drawer {
      position: fixed; top: 0; right: 0;
      width: 340px; max-width: 90vw; height: 100vh;
      background: #FFFFFF; border-left: 1px solid #E2E8F0;
      box-shadow: -12px 0 36px rgba(15, 23, 42, 0.14);
      transform: translateX(100%); transition: transform 0.2s ease;
      z-index: 200; display: flex; flex-direction: column; padding: 24px;
    }
    .toc-drawer.open { transform: translateX(0); }
    .toc-title { font-size: 16px; font-weight: 800; color: #0F172A; margin-bottom: 14px; }
    .toc-list { list-style: none; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    .toc-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border-radius: 8px; cursor: pointer;
      font-size: 14px; font-weight: 600; color: #334155;
    }
    .toc-item:hover { background: #F8FAFC; color: #0F172A; }
    .toc-item.active { background: #EFF6FF; color: #1D4ED8; font-weight: 800; }
    .toc-num { font-family: var(--font-mono); font-size: 12px; color: #94A3B8; width: 22px; }
    .toc-item.active .toc-num { color: #2563EB; }
  </style>
</head>
<body>
  <div class="viewport-scaler">
    <div class="presentation-stage" id="stage">

      <!-- ==================== SLIDE 1: AGENT 核心要素与共性抽象 ==================== -->
      <section class="slide active" data-title="Agent 的本质定义与核心要素">

            <!-- Dead-end red stop -->

            <line x1="186" y1="722" x2="310" y2="722" stroke="#BE123C" stroke-width="4.5" stroke-linecap="round"/>

            <circle cx="1200" cy="526" r="204" fill="#F8FAFC" opacity="0.72"/>

            <path d="M 1434 316 Q 1478 368, 1488 446" fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" marker-end="url(#m-blue-lg)"/>
            <path d="M 1488 602 Q 1478 672, 1446 728" fill="none" stroke="#2563EB" stroke-width="4.5" stroke-linecap="round" marker-end="url(#m-blue-lg)"/>

            <text x="1200" y="538" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="800">有状态闭环</text>
            <text x="1200" y="578" text-anchor="middle" fill="#DBEAFE" font-size="22" font-weight="600">自主决定下一步</text>

            <!-- NODE 01 (TOP): 持续感知 -->
            <g transform="translate(972, 182)">
              <rect x="0" y="0" width="456" height="126" rx="16" fill="#FFFFFF" stroke="#2563EB" stroke-width="2.5"/>

            <!-- NODE 02 (RIGHT): 推理与规划 -->

        </div>
      </section>

      <!-- ==================== SLIDE 2: 时序 + AGENT 定义与结合机制 ==================== -->
      <section class="slide" data-title="时序与 Agent 的定义及结合机制">
        <header class="slide-header">
          <div class="header-left">
            <span class="slide-num">02</span>
            <h1 class="slide-title">时序 + Agent：以语义控制流驾驭数值计算流</h1>
          </div>
          <nav class="slide-agenda-rail"></nav>
        </header>

  </aside>

  <script>
    (function () {
      const stage = document.getElementById('stage');
      const slides = Array.from(document.querySelectorAll('.slide'));
      const total = slides.length;
      const shortLabels = [
        '1 本质要素', '2 时序结合', '3 分类总览',
        '4 预测推理', '5 增强合成', '6 异常诊断', '7 决策支持',
        '8 TimeCopilot', '9 TS-Reasoner', '10 NEXUS', '11 思考'
      ];

      let current = 0;

      // Build top agenda rails on every slide
      slides.forEach((slide) => {
        const rail = slide.querySelector('.slide-agenda-rail');
        if (!rail) return;
        rail.innerHTML = '';
        shortLabels.forEach((label, idx) => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'agenda-pill';
          btn.textContent = label;
          btn.addEventListener('click', () => goTo(idx));
          rail.appendChild(btn);
        });
      });

      // Build TOC drawer
      const tocList = document.getElementById('toc-list');
      slides.forEach((slide, idx) => {
        const li = document.createElement('li');
        li.className = 'toc-item';
        const num = String(idx + 1).padStart(2, '0');
        li.innerHTML = `<span class="toc-num">${num}</span><span>${slide.dataset.title || shortLabels[idx]}</span>`;
        li.addEventListener('click', () => {
          goTo(idx);
          closeDrawer();
        });
        tocList.appendChild(li);
      });

      const hudCounter = document.getElementById('hud-counter');
      const tocItems = Array.from(tocList.querySelectorAll('.toc-item'));

      function goTo(index) {
        current = (index + total) % total;
        slides.forEach((s, i) => {
          s.classList.toggle('active', i === current);
          const pills = s.querySelectorAll('.agenda-pill');
          pills.forEach((p, j) => p.classList.toggle('active', j === current));
        });
        tocItems.forEach((item, i) => item.classList.toggle('active', i === current));
        hudCounter.textContent = `${String(current + 1).padStart(2, '0')} / ${String(total).padStart(2, '0')}`;
      }

      function fitStage() {
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const scale = Math.min(vw / 1920, vh / 1080);
        stage.style.transform = `scale(${scale})`;
      }

      const drawer = document.getElementById('toc-drawer');
      const backdrop = document.getElementById('drawer-backdrop');
      function openDrawer() { drawer.classList.add('open'); backdrop.classList.add('open'); }
      function closeDrawer() { drawer.classList.remove('open'); backdrop.classList.remove('open'); }

      document.getElementById('btn-prev').addEventListener('click', () => goTo(current - 1));
      document.getElementById('btn-next').addEventListener('click', () => goTo(current + 1));
      document.getElementById('btn-toc').addEventListener('click', openDrawer);
      backdrop.addEventListener('click', closeDrawer);

      window.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
          e.preventDefault(); goTo(current + 1);
        } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
          e.preventDefault(); goTo(current - 1);
        } else if (e.key === 'Escape') {
          closeDrawer();
        }
      });

      window.addEventListener('resize', fitStage);
      fitStage();
      goTo(0);
    })();
  </script>
