<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 245" role="img" aria-labelledby="title desc">
  <title id="title">多变量序列沿时间轴同步滑窗</title>
  <desc id="desc">两次预测各使用六个历史时刻预测之后三个时刻，第二个窗口向右移动两个时刻。每个时刻包含全部变量。</desc>
  <defs>
    <pattern id="input" width="52" height="38" patternUnits="userSpaceOnUse"><rect width="50" height="38" fill="#d5eae7"/></pattern>
    <pattern id="target" width="52" height="38" patternUnits="userSpaceOnUse"><rect width="50" height="38" fill="#dbe4f4"/></pattern>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="19" fill="#243e48">
    <text x="28" y="95">窗口 1</text><text x="28" y="164">窗口 2</text>
    <g transform="translate(130 68)">
      <rect width="312" height="38" fill="url(#input)"/><rect x="312" width="156" height="38" fill="url(#target)"/>
      <text x="156" y="26" text-anchor="middle">输入 · 6 个时刻</text><text x="390" y="26" text-anchor="middle">预测 · 3 步</text>
    </g>
    <g transform="translate(234 138)">
      <rect width="312" height="38" fill="url(#input)"/><rect x="312" width="156" height="38" fill="url(#target)"/>
      <text x="156" y="26" text-anchor="middle">输入 · 6 个时刻</text><text x="390" y="26" text-anchor="middle">预测 · 3 步</text>
    </g>
    <path d="M130 208H730m-10 -6 10 6-10 6" fill="none" stroke="#536975" stroke-width="2"/>
    <g font-family="monospace" font-size="16" text-anchor="middle">
      <text x="156" y="232">1</text><text x="260" y="232">3</text><text x="416" y="232">6</text>
      <text x="520" y="232">8</text><text x="572" y="232">9</text><text x="676" y="232">11</text>
    </g>
    <text x="731" y="202" font-size="16">时间</text>
  </g>
</svg>
